<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Thai Name Generator</title>


  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg"
  >

  <link
    rel="shortcut icon"
    href="favicon.svg"
  >

  <link
    rel="apple-touch-icon"
    href="favicon.svg"
  >


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top left,
          #f9ddf5 0%,
          transparent 38%
        ),
        radial-gradient(
          circle at top right,
          #e2d9ff 0%,
          transparent 38%
        ),
        linear-gradient(
          135deg,
          #fff5fb,
          #f5f1ff
        );

      color: #293142;

      padding:
        40px 20px 70px;
    }


    .container {

      max-width: 1200px;

      margin: 0 auto;

    }


    /* =========================
       HEADER
    ========================= */

    header {

      text-align: center;

      margin-bottom: 35px;

    }


    .logo {

      width: 74px;

      height: 74px;

      margin:
        0 auto 18px;

      border-radius: 22px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 42px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #ec4899
        );

      box-shadow:
        0 12px 30px
        rgba(124, 58, 237, .25);

    }


    h1 {

      font-size: 50px;

      font-weight: 850;

      line-height: 1.1;

      margin-bottom: 14px;

      background:
        linear-gradient(
          90deg,
          #70219b,
          #b82291
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

    }


    .subtitle {

      color: #747887;

      font-size: 18px;

    }


    /* =========================
       MAIN PANEL
    ========================= */

    .panel {

      background:
        rgba(255, 255, 255, .96);

      border-radius: 28px;

      padding: 32px;

      box-shadow:
        0 25px 70px
        rgba(75, 45, 120, .13);

    }


    /* =========================
       FORM
    ========================= */

    .form-grid {

      display: grid;

      grid-template-columns:
        1fr 300px;

      gap: 22px;

      margin-bottom: 20px;

    }


    label {

      display: block;

      font-size: 17px;

      font-weight: 750;

      margin-bottom: 10px;

    }


    .type-selector {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      background: #f0edff;

      border:
        1px solid #e3dbff;

      padding: 6px;

      border-radius: 18px;

    }


    .type-btn {

      border: none;

      background: transparent;

      border-radius: 13px;

      padding: 14px;

      font-size: 17px;

      font-weight: 750;

      color: #747989;

      cursor: pointer;

      transition: .2s;

    }


    .type-btn.active {

      background: white;

      color: #5927a4;

      box-shadow:
        0 3px 12px
        rgba(60, 40, 100, .10);

    }


    #count {

      width: 100%;

      height: 64px;

      border-radius: 18px;

      border:
        1px solid #dedfe5;

      padding:
        0 18px;

      font-size: 18px;

      outline: none;

    }


    #count:focus {

      border-color:
        #9347df;

    }


    /* =========================
       GENERATE BUTTON
    ========================= */

    #generateBtn {

      width: 100%;

      height: 66px;

      border: none;

      border-radius: 17px;

      background:
        linear-gradient(
          90deg,
          #7c3aed,
          #ed3b96
        );

      color: white;

      font-size: 19px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 12px 28px
        rgba(139, 57, 220, .25);

      transition: .2s;

    }


    #generateBtn:hover {

      transform:
        translateY(-1px);

    }


    #generateBtn:active {

      transform:
        translateY(1px);

    }


    /* =========================
       RESULTS
    ========================= */

    .results-section {

      margin-top: 34px;

    }


    .results-header {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      margin-bottom: 20px;

    }


    .results-header h2 {

      font-size: 30px;

      font-weight: 850;

    }


    .count-badge {

      background:
        #eee6ff;

      color:
        #5c25a9;

      padding:
        10px 18px;

      border-radius: 30px;

      font-weight: 800;

    }


    #results {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 16px;

    }


    /* =========================
       NAME CARD
    ========================= */

    .name-card {

      background: white;

      border:
        1px solid #e0e2e8;

      border-radius: 20px;

      padding: 20px;

      transition: .2s;

    }


    .name-card:hover {

      border-color:
        #d0c4f7;

      box-shadow:
        0 8px 25px
        rgba(70, 40, 120, .08);

    }


    .name-top {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 12px;

      margin-bottom: 18px;

    }


    .full-name {

      font-size: 23px;

      font-weight: 850;

      color: #293142;

      line-height: 1.3;

    }


    .copy-buttons {

      display: flex;

      gap: 8px;

    }


    /* =========================
       COPY BUTTON
    ========================= */

    .copy-btn,
    .copy-id {

      border:
        1px solid #dfe2e7;

      background: white;

      border-radius: 9px;

      padding:
        9px 13px;

      font-size: 13px;

      font-weight: 750;

      white-space: nowrap;

      cursor: pointer;

      transition:
        .2s ease;

    }


    .copy-btn:hover,
    .copy-id:hover {

      background:
        #faf9ff;

    }


    /* =========================
       GREEN COPIED STATE
    ========================= */

    .copy-btn.copied,
    .copy-id.copied {

      color:
        #059669;

      border-color:
        #6ee7b7;

      background:
        #f0fdf9;

    }


    /* =========================
       ID ROW
    ========================= */

    .id-row {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 12px;

      background:
        #f8f9fb;

      border:
        1px solid #e1e4e9;

      border-radius: 13px;

      padding:
        12px 14px;

    }


    .id-text {

      color:
        #747b89;

      font-size: 15px;

      font-weight: 600;

    }


    .id-text strong {

      color:
        #293142;

      font-size: 17px;

      letter-spacing:
        .6px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      body {

        padding:
          25px 12px 50px;

      }


      h1 {

        font-size: 36px;

      }


      .panel {

        padding: 20px;

      }


      .form-grid {

        grid-template-columns:
          1fr;

      }


      #results {

        grid-template-columns:
          1fr;

      }

    }


    @media (max-width: 520px) {

      .name-top {

        flex-direction:
          column;

        align-items:
          stretch;

      }


      .copy-buttons {

        width: 100%;

      }


      .copy-btn {

        flex: 1;

      }


      .id-row {

        flex-direction:
          column;

        align-items:
          stretch;

      }


      .copy-id {

        width: 100%;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- =========================
         HEADER
    ========================= -->

    <header>


      <div class="logo">
        ✦
      </div>


      <h1>
        Thai Name Generator
      </h1>


      <p class="subtitle">
        สร้างชื่อไทย ชื่ออังกฤษ แบบสุ่ม
        พร้อมเลขบัตรประชาชนจำลอง
      </p>


    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="panel">


      <!-- =========================
           SELECTOR
      ========================= -->

      <div class="form-grid">


        <div>


          <label id="typeLabel">
            ประเภทชื่อหลัก
          </label>


          <div class="type-selector">


            <button
              class="type-btn active"
              data-type="thai"
              type="button"
            >

              🇹🇭 &nbsp;ชื่อไทย

            </button>


            <button
              class="type-btn"
              data-type="english"
              type="button"
            >

              🇬🇧 &nbsp;English

            </button>


          </div>


        </div>



        <div>


          <label id="countLabel">
            จำนวนชื่อ
          </label>


          <input
            id="count"
            type="number"
            min="1"
            max="100"
            value="10"
          >


        </div>


      </div>



      <!-- =========================
           GENERATE BUTTON
      ========================= -->

      <button
        id="generateBtn"
        type="button"
      >

        ✨ สุ่มชื่อ

      </button>



      <!-- =========================
           RESULTS
      ========================= -->

      <section
        class="results-section"
      >


        <div
          class="results-header"
        >


          <h2 id="resultsTitle">
            ชื่อที่สร้างขึ้น
          </h2>


          <span
            id="countBadge"
            class="count-badge"
          >
            10 ชื่อ
          </span>


        </div>


        <div id="results"></div>


      </section>


    </main>


  </div>



  <script type="module">


    /* =========================
       IMPORT DATA
    ========================= */

    import {

      thaiNames,

      englishNames,

      thaiSurnames,

      englishSurnames

    } from "./data/names.js";



    /* =========================
       STATE
    ========================= */

    let currentType =
      "thai";



    /* =========================
       ELEMENTS
    ========================= */

    const countInput =
      document.getElementById(
        "count"
      );


    const generateBtn =
      document.getElementById(
        "generateBtn"
      );


    const results =
      document.getElementById(
        "results"
      );


    const countBadge =
      document.getElementById(
        "countBadge"
      );


    const resultsTitle =
      document.getElementById(
        "resultsTitle"
      );


    const typeLabel =
      document.getElementById(
        "typeLabel"
      );


    const countLabel =
      document.getElementById(
        "countLabel"
      );


    const typeButtons =
      document.querySelectorAll(
        ".type-btn"
      );



    /* =========================
       RANDOM ITEM
    ========================= */

    function randomItem(array) {

      return array[
        Math.floor(
          Math.random() *
          array.length
        )
      ];

    }



    /* =========================
       RANDOM NAME
    ========================= */

    function getRandomName(
      names,
      gender
    ) {


      const styles =
        Object.keys(
          names[gender]
        );


      const randomStyle =
        randomItem(styles);


      return randomItem(
        names[gender][randomStyle]
      );

    }



    /* =========================
       THAI ID CARD
    ========================= */

    function generateCitizenId() {


      const digits = [];


      /*
        First digit
        1 - 8
      */

      digits.push(

        Math.floor(
          Math.random() * 8
        ) + 1

      );


      /*
        Digits 2 - 12
      */

      for (
        let i = 1;
        i < 12;
        i++
      ) {

        digits.push(

          Math.floor(
            Math.random() * 10
          )

        );

      }


      /*
        Thai ID checksum

        digit 1 × 13
        digit 2 × 12
        ...
        digit 12 × 2
      */

      let sum = 0;


      for (
        let i = 0;
        i < 12;
        i++
      ) {

        sum +=
          digits[i] *
          (13 - i);

      }


      /*
        Check digit
      */

      const checkDigit =
        (11 - (sum % 11)) % 10;


      digits.push(
        checkDigit
      );


      return digits.join("");

    }



    /* =========================
       GENERATE PROFILE
    ========================= */

    function generateProfile() {


      /*
        Same gender for
        Thai + English
      */

      const gender =
        Math.random() < 0.5
          ? "male"
          : "female";


      let firstName;
      let surname;


      /* =========================
         THAI
      ========================= */

      if (
        currentType === "thai"
      ) {


        firstName =
          getRandomName(
            thaiNames,
            gender
          );


        surname =
          randomItem(
            thaiSurnames
          );


      }


      /* =========================
         ENGLISH
      ========================= */

      else {


        firstName =
          getRandomName(
            englishNames,
            gender
          );


        surname =
          randomItem(
            englishSurnames
          );

      }


      return {

        firstName:
          firstName,

        surname:
          surname,

        citizenId:
          generateCitizenId()

      };

    }



    /* =========================
       LANGUAGE UPDATE
    ========================= */

    function updateLanguage() {


      /*
        ========================
        THAI
        ========================
      */

      if (
        currentType === "thai"
      ) {


        document.documentElement.lang =
          "th";


        typeLabel.textContent =
          "ประเภทชื่อหลัก";


        countLabel.textContent =
          "จำนวนชื่อ";


        generateBtn.textContent =
          "✨ สุ่มชื่อ";


        resultsTitle.textContent =
          "ชื่อที่สร้างขึ้น";


        countBadge.textContent =
          `${countInput.value} ชื่อ`;

      }


      /*
        ========================
        ENGLISH
        ========================
      */

      else {


        document.documentElement.lang =
          "en";


        typeLabel.textContent =
          "Name Type";


        countLabel.textContent =
          "Number of Names";


        generateBtn.textContent =
          "✨ Generate Names";


        resultsTitle.textContent =
          "Generated Names";


        countBadge.textContent =
          `${countInput.value} names`;

      }

    }



    /* =========================
       COPY FUNCTION
    ========================= */

    async function copyText(
      text,
      button,
      type
    ) {


      try {


        await navigator.clipboard.writeText(
          text
        );


      } catch {


        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          text;


        document.body.appendChild(
          textarea
        );


        textarea.select();


        document.execCommand(
          "copy"
        );


        textarea.remove();

      }



      /*
        GREEN
      */

      button.classList.add(
        "copied"
      );



      /* =========================
         THAI COPIED
      ========================= */

      if (
        currentType === "thai"
      ) {


        if (
          type === "name"
        ) {

          button.textContent =
            "คัดลอกชื่อ ✓";

        }


        else if (
          type === "surname"
        ) {

          button.textContent =
            "คัดลอกนามสกุล ✓";

        }


        else if (
          type === "id"
        ) {

          button.textContent =
            "คัดลอกเลขบัตรประชาชน ✓";

        }

      }



      /* =========================
         ENGLISH COPIED
      ========================= */

      else {


        if (
          type === "name"
        ) {

          button.textContent =
            "Name Copied ✓";

        }


        else if (
          type === "surname"
        ) {

          button.textContent =
            "Surname Copied ✓";

        }


        else if (
          type === "id"
        ) {

          button.textContent =
            "ID Copied ✓";

        }

      }



      /*
        Return to original text
        after 1.5 seconds
      */

      setTimeout(() => {


        button.classList.remove(
          "copied"
        );


        /* =====================
           THAI
        ===================== */

        if (
          currentType === "thai"
        ) {


          if (
            type === "name"
          ) {

            button.textContent =
              "คัดลอกชื่อ";

          }


          else if (
            type === "surname"
          ) {

            button.textContent =
              "คัดลอกนามสกุล";

          }


          else if (
            type === "id"
          ) {

            button.textContent =
              "คัดลอกเลขบัตร";

          }

        }



        /* =====================
           ENGLISH
        ===================== */

        else {


          if (
            type === "name"
          ) {

            button.textContent =
              "Copy Name";

          }


          else if (
            type === "surname"
          ) {

            button.textContent =
              "Copy Surname";

          }


          else if (
            type === "id"
          ) {

            button.textContent =
              "Copy ID";

          }

        }


      }, 1500);

    }



    /* =========================
       CREATE CARD
    ========================= */

    function createCard(
      profile
    ) {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "name-card";


      const fullName =
        `${profile.firstName} ${profile.surname}`;



      /*
        Button text
      */

      const copyNameText =

        currentType === "thai"
          ? "คัดลอกชื่อ"
          : "Copy Name";


      const copySurnameText =

        currentType === "thai"
          ? "คัดลอกนามสกุล"
          : "Copy Surname";


      const idLabel =

        currentType === "thai"
          ? "เลขบัตรประชาชน:"
          : "ID Card:";


      const copyIdText =

        currentType === "thai"
          ? "คัดลอกเลขบัตร"
          : "Copy ID";



      card.innerHTML = `

        <div class="name-top">


          <div class="full-name">

            ${fullName}

          </div>


          <div class="copy-buttons">


            <button
              class="copy-btn"
              type="button"
              data-value="${profile.firstName}"
              data-copy-type="name"
            >

              ${copyNameText}

            </button>


            <button
              class="copy-btn"
              type="button"
              data-value="${profile.surname}"
              data-copy-type="surname"
            >

              ${copySurnameText}

            </button>


          </div>


        </div>


        <div class="id-row">


          <div class="id-text">

            ${idLabel}

            <strong>
              ${profile.citizenId}
            </strong>

          </div>


          <button
            class="copy-id"
            type="button"
            data-value="${profile.citizenId}"
            data-copy-type="id"
          >

            ${copyIdText}

          </button>


        </div>

      `;



      /*
        COPY EVENTS
      */

      const copyButtons =
        card.querySelectorAll(
          "[data-value]"
        );


      copyButtons.forEach(
        button => {


          button.addEventListener(
            "click",
            () => {


              copyText(

                button.dataset.value,

                button,

                button.dataset.copyType

              );


            }
          );


        }
      );


      return card;

    }



    /* =========================
       GENERATE NAMES
    ========================= */

    function generateNames() {


      let count =
        parseInt(
          countInput.value,
          10
        );


      /*
        Default
      */

      if (
        Number.isNaN(count)
      ) {

        count = 10;

      }


      /*
        1 - 100
      */

      count =
        Math.max(
          1,
          Math.min(
            100,
            count
          )
        );


      countInput.value =
        count;



      /*
        Badge
      */

      if (
        currentType === "thai"
      ) {

        countBadge.textContent =
          `${count} ชื่อ`;

      }

      else {

        countBadge.textContent =
          `${count} names`;

      }



      /*
        Clear old results
      */

      results.innerHTML =
        "";



      /*
        Generate
      */

      for (
        let i = 0;
        i < count;
        i++
      ) {


        const profile =
          generateProfile();


        const card =
          createCard(
            profile
          );


        results.appendChild(
          card
        );

      }

    }



    /* =========================
       LANGUAGE BUTTONS
    ========================= */

    typeButtons.forEach(
      button => {


        button.addEventListener(
          "click",
          () => {


            /*
              Remove active
              from all
            */

            typeButtons.forEach(
              btn => {

                btn.classList.remove(
                  "active"
                );

              }
            );


            /*
              Active button
            */

            button.classList.add(
              "active"
            );


            /*
              Change language
            */

            currentType =
              button.dataset.type;


            /*
              Update text
            */

            updateLanguage();


            /*
              Generate again
            */

            generateNames();

          }
        );

      }
    );



    /* =========================
       GENERATE BUTTON
    ========================= */

    generateBtn.addEventListener(
      "click",
      generateNames
    );



    /* =========================
       COUNT CHANGE
    ========================= */

    countInput.addEventListener(
      "change",
      () => {


        let count =
          parseInt(
            countInput.value,
            10
          );


        if (
          Number.isNaN(count)
        ) {

          count = 10;

        }


        count =
          Math.max(
            1,
            Math.min(
              100,
              count
            )
          );


        countInput.value =
          count;


        updateLanguage();

      }
    );



    /* =========================
       ENTER KEY
    ========================= */

    countInput.addEventListener(
      "keydown",
      event => {


        if (
          event.key === "Enter"
        ) {

          generateNames();

        }

      }
    );



    /* =========================
       INITIAL
       GENERATE 10
    ========================= */

    updateLanguage();

    generateNames();


  </script>


</body>

</html>
