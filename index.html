<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Thai Name Generator - สุ่มชื่อไทย ชื่ออังกฤษ นามสกุล และข้อมูลจำลอง"
  />

  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thai Name Generator" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237c3aed'/%3E%3Ctext x='50' y='65' font-size='60' font-weight='bold' fill='white' text-anchor='middle' font-family='system-ui'%3E🇹%3C/text%3E%3C/svg%3E" />
  <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237c3aed'/%3E%3Ctext x='50' y='65' font-size='60' font-weight='bold' fill='white' text-anchor='middle' font-family='system-ui'%3E🇹%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='45' fill='%237c3aed'/%3E%3Ctext x='90' y='125' font-size='110' font-weight='bold' fill='white' text-anchor='middle' font-family='system-ui'%3E🇹%3C/text%3E%3C/svg%3E" />

  <title>Thai Name Generator</title>

  <style>
    :root {
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --secondary: #ec4899;

      --bg: #f8f7ff;
      --card: rgba(255, 255, 255, 0.94);

      --text: #1f2937;
      --muted: #6b7280;

      --border: #e5e7eb;

      --success: #059669;

      --shadow:
        0 20px 60px rgba(76, 29, 149, 0.12);

      --shadow-hover:
        0 24px 70px rgba(76, 29, 149, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(236, 72, 153, 0.14),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(124, 58, 237, 0.16),
          transparent 32%
        ),
        var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(
        1050px,
        calc(100% - 32px)
      );

      margin: 0 auto;
    }

    /* ========================================
       HEADER
    ======================================== */

    header {
      text-align: center;

      padding:
        58px
        0
        30px;
    }

    .logo {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 64px;
      height: 64px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );

      color: white;

      font-size: 30px;

      box-shadow:
        0 12px 30px
        rgba(124, 58, 237, 0.25);

      margin-bottom: 16px;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(
          34px,
          6vw,
          54px
        );

      line-height: 1.05;

      letter-spacing: -1.5px;

      background:
        linear-gradient(
          135deg,
          #4c1d95,
          #db2777
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .subtitle {
      color: var(--muted);

      font-size: 17px;

      margin:
        14px
        auto
        0;

      max-width: 680px;

      line-height: 1.6;
    }

    /* ========================================
       MAIN PANEL
    ======================================== */

    .panel {
      background: var(--card);

      border:
        1px solid
        rgba(255, 255, 255, 0.8);

      border-radius: 28px;

      padding: 26px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(10px);

      transition:
        box-shadow 0.25s ease;
    }

    .panel:hover {
      box-shadow: var(--shadow-hover);
    }

    /* ========================================
       CONTROLS
    ======================================== */

    .controls {
      display: grid;

      grid-template-columns:
        minmax(0, 1.4fr)
        minmax(130px, 0.55fr);

      gap: 18px;

      align-items: end;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;

      font-size: 15px;

      font-weight: 800;

      margin-bottom: 9px;
    }

    /* ========================================
       NAME TYPE SELECTOR
    ======================================== */

    .name-type-selector {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 6px;

      padding: 5px;

      min-height: 54px;

      background: #f3f0ff;

      border:
        1px solid
        #e9e3ff;

      border-radius: 16px;
    }

    .type-option {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 44px;

      border: 0;

      border-radius: 12px;

      background: transparent;

      color: var(--muted);

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      transition:
        color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.15s ease;
    }

    .type-option:hover {
      color: var(--primary-dark);

      background:
        rgba(255, 255, 255, 0.7);
    }

    .type-option:active {
      transform: scale(0.98);
    }

    .type-option.active {
      color: var(--primary-dark);

      background: white;

      box-shadow:
        0 5px 15px
        rgba(76, 29, 149, 0.10);
    }

    .type-flag {
      font-size: 21px;

      line-height: 1;
    }

    /* ========================================
       NUMBER INPUT
    ======================================== */

    .number-field {
      min-width: 0;
    }

    input[type="number"] {
      width: 100%;

      height: 54px;

      border:
        1px solid
        var(--border);

      border-radius: 16px;

      background: white;

      color: var(--text);

      padding:
        0
        15px;

      font-size: 16px;

      outline: none;

      transition:
        0.2s ease;
    }

    input[type="number"]:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 4px
        rgba(124, 58, 237, 0.1);
    }

    /* ========================================
       GENERATE BUTTON
    ======================================== */

    .generate-wrapper {
      grid-column: 1 / -1;
    }

    .generate-btn {
      width: 100%;

      min-height: 56px;

      border: 0;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );

      color: white;

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 12px 26px
        rgba(124, 58, 237, 0.22);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        filter 0.15s ease;
    }

    .generate-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 16px 32px
        rgba(124, 58, 237, 0.28);

      filter: brightness(1.03);
    }

    .generate-btn:active {
      transform: translateY(0);

      box-shadow:
        0 8px 18px
        rgba(124, 58, 237, 0.20);
    }

    /* ========================================
       RESULTS HEADER
    ======================================== */

    .results-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 16px;

      margin:
        32px
        0
        16px;
    }

    .results-header h2 {
      margin: 0;

      font-size: 24px;

      letter-spacing: -0.4px;
    }

    .count-badge {
      flex-shrink: 0;

      color: var(--primary-dark);

      background: #ede9fe;

      border-radius: 999px;

      padding:
        7px
        14px;

      font-size: 14px;

      font-weight: 800;
    }

    /* ========================================
       RESULTS GRID
    ======================================== */

    .results {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 14px;
    }

    .name-card {
      display: flex;

      flex-direction: column;

      gap: 12px;

      min-width: 0;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      padding:
        17px
        18px;

      animation:
        appear
        0.25s
        ease
        both;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .name-card:hover {
      transform: translateY(-2px);

      border-color:
        #ddd6fe;

      box-shadow:
        0 10px 30px
        rgba(76, 29, 149, 0.08);
    }

    @keyframes appear {
      from {
        opacity: 0;

        transform:
          translateY(7px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }

    /* ========================================
       NAME HEADER
    ======================================== */

    .name-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;
    }

    .name-info {
      min-width: 0;

      flex: 1;
    }

    .name {
      font-size: 20px;

      font-weight: 850;

      line-height: 1.35;

      overflow-wrap: anywhere;
    }

    .action-buttons {
      display: flex;

      align-items: center;

      gap: 6px;

      flex: 0 0 auto;
    }

    /* ========================================
       COPY BUTTON
    ======================================== */

    .copy-btn {
      border:
        1px solid
        var(--border);

      background: #fafafa;

      color: var(--text);

      border-radius: 9px;

      padding:
        7px
        10px;

      cursor: pointer;

      font-weight: 750;

      font-size: 12px;

      white-space: nowrap;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease;
    }

    .copy-btn:hover {
      background: #f3f4f6;

      border-color: #d1d5db;
    }

    .copy-btn.copied {
      color: var(--success);

      border-color:
        #a7f3d0;

      background:
        #ecfdf5;
    }

    /* ========================================
       ID CARD ROW
    ======================================== */

    .detail-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      min-width: 0;

      font-size: 13.5px;

      color: var(--muted);

      background: #f9fafb;

      padding:
        9px
        11px;

      border-radius: 11px;

      border:
        1px solid
        var(--border);
    }

    .detail-row span {
      min-width: 0;

      overflow-wrap: anywhere;
    }

    .detail-row span strong {
      color: var(--text);

      letter-spacing: 0.3px;
    }

    /* ========================================
       EMPTY
    ======================================== */

    .empty {
      grid-column: 1 / -1;

      text-align: center;

      color: var(--muted);

      padding:
        40px
        10px;
    }

    /* ========================================
       TIP
    ======================================== */

    .tip {
      margin-top: 20px;

      padding:
        14px
        16px;

      background: #faf5ff;

      color: #6b21a8;

      border-radius: 14px;

      font-size: 13px;

      line-height: 1.7;

      border:
        1px solid
        #f3e8ff;
    }

    /* ========================================
       FOOTER
    ======================================== */

    footer {
      text-align: center;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;

      padding:
        28px
        0
        40px;
    }

    /* ========================================
       TABLET
    ======================================== */

    @media (max-width: 850px) {

      .container {
        width:
          min(
            100% - 24px,
            1050px
          );
      }

      .panel {
        padding: 20px;
      }

      .results {
        grid-template-columns: 1fr;
      }

    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

      .container {
        width:
          calc(100% - 20px);
      }

      header {
        padding:
          36px
          0
          22px;
      }

      .logo {
        width: 58px;
        height: 58px;

        border-radius: 18px;

        font-size: 27px;

        margin-bottom: 14px;
      }

      h1 {
        font-size:
          clamp(
            32px,
            11vw,
            44px
          );

        letter-spacing:
          -1px;
      }

      .subtitle {
        font-size: 15px;

        padding:
          0
          8px;
      }

      .panel {
        padding:
          16px;

        border-radius: 22px;
      }

      .controls {
        grid-template-columns: 1fr;

        gap: 15px;
      }

      .name-type-selector {
        min-height: 52px;

        gap: 4px;

        padding: 4px;

        border-radius: 15px;
      }

      .type-option {
        min-height: 44px;

        padding:
          0
          8px;

        font-size: 13px;
      }

      .type-flag {
        font-size: 19px;
      }

      input[type="number"] {
        height: 52px;
      }

      .generate-btn {
        min-height: 54px;

        font-size: 16px;
      }

      .results-header {
        margin:
          26px
          0
          14px;
      }

      .results-header h2 {
        font-size: 21px;
      }

      .count-badge {
        padding:
          6px
          11px;

        font-size: 13px;
      }

      .name-card {
        padding:
          15px;

        border-radius: 16px;
      }

      .name-header {
        align-items: flex-start;

        flex-direction: column;

        gap: 10px;
      }

      .name {
        font-size: 19px;
      }

      .action-buttons {
        width: 100%;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 7px;
      }

      .copy-btn {
        width: 100%;

        min-height: 38px;

        padding:
          7px
          8px;
      }

      .detail-row {
        align-items: stretch;

        flex-direction: column;

        gap: 8px;

        font-size: 13px;
      }

      .detail-row .copy-btn {
        width: 100%;
      }

      .tip {
        font-size: 12.5px;

        padding:
          13px
          14px;
      }

      footer {
        padding:
          22px
          0
          30px;
      }

    }

    /* ========================================
       SMALL MOBILE
    ======================================== */

    @media (max-width: 390px) {

      .container {
        width:
          calc(100% - 14px);
      }

      .panel {
        padding: 13px;
      }

      .type-option {
        gap: 5px;

        font-size: 12px;
      }

      .type-flag {
        font-size: 17px;
      }

      .results-header {
        align-items: flex-start;
      }

      .results-header h2 {
        font-size: 19px;
      }

    }

    /* ========================================
       REDUCED MOTION
    ======================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }

    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="logo">🇹🇭</div>
      <h1>Thai Name Generator</h1>
      <p class="subtitle">
        สร้างชื่อไทย ชื่ออังกฤษ และชื่อเล่นอย่างสุ่ม
      </p>
    </header>

    <div class="panel">
      <div class="controls">
        <div class="field">
          <label for="type">ประเภทชื่อ</label>
          <div class="name-type-selector">
            <button type="button" class="type-option active" data-type="thai">
              <span class="type-flag">🇹🇭</span>
              ไทย
            </button>
            <button type="button" class="type-option" data-type="english">
              <span class="type-flag">🇬🇧</span>
              English
            </button>
          </div>
        </div>

        <div class="field number-field">
          <label for="count">จำนวนชื่อ</label>
          <input
            type="number"
            id="count"
            min="1"
            max="20"
            value="2"
            placeholder="จำนวนชื่อ"
          />
        </div>

        <div class="generate-wrapper">
          <button type="button" class="generate-btn" id="generateBtn">
            สุ่มชื่อ ✨
          </button>
        </div>
      </div>
    </div>

    <div id="results" class="results" style="display: none;">
      <div class="results-header" style="grid-column: 1 / -1;">
        <h2>ผลลัพธ์ 🎯</h2>
        <span class="count-badge" id="countBadge">0</span>
      </div>
    </div>

    <div class="empty" id="empty" style="display: none;">
      กรุณากด "สุ่มชื่อ" เพื่อเริ่มต้น
    </div>

    <div class="tip">
      💡 <strong>เคล็ดลับ:</strong> คลิก "คัดลอก" เพื่อคัดลอกชื่อไปยังคลิปบอร์ด
    </div>
  </div>

  <footer>
    <p>
      🇹🇭 Thai Name Generator | Created with ❤️ by
      <a href="https://github.com/Thivabc" target="_blank" style="color: var(--primary); text-decoration: none;">@Thivabc</a>
    </p>
    <p style="margin: 8px 0 0; font-size: 12px; color: var(--muted);">
      © 2024 All rights reserved
    </p>
  </footer>

  <script type="module">
    import { thaiNames, englishNames } from './data/names.js';

    const generateBtn = document.getElementById('generateBtn');
    const countInput = document.getElementById('count');
    const resultsContainer = document.getElementById('results');
    const emptyState = document.getElementById('empty');
    const countBadge = document.getElementById('countBadge');
    const typeButtons = document.querySelectorAll('.type-option');

    let currentType = 'thai';

    // Type selection
    typeButtons.forEach(button => {
      button.addEventListener('click', () => {
        typeButtons.forEach(b => b.classList.remove('active'));
        button.classList.add('active');
        currentType = button.dataset.type;
      });
    });

    function getRandomName(names) {
      const keys = Object.keys(names);
      const genderKey = keys[Math.floor(Math.random() * keys.length)];
      const gender = names[genderKey];

      const styleKeys = Object.keys(gender);
      const styleKey = styleKeys[Math.floor(Math.random() * styleKeys.length)];
      const nameArray = gender[styleKey];

      return nameArray[Math.floor(Math.random() * nameArray.length)];
    }

    function generateNames() {
      const count = Math.min(20, Math.max(1, parseInt(countInput.value) || 2));
      const names = currentType === 'thai' ? thaiNames : englishNames;

      resultsContainer.innerHTML = `
        <div class="results-header" style="grid-column: 1 / -1;">
          <h2>ผลลัพธ์ 🎯</h2>
          <span class="count-badge">${count}</span>
        </div>
      `;

      emptyState.style.display = 'none';
      resultsContainer.style.display = 'grid';

      for (let i = 0; i < count; i++) {
        const name = getRandomName(names);
        const randomId = Math.random().toString(36).substr(2, 9);

        const card = document.createElement('div');
        card.className = 'name-card';
        card.innerHTML = `
          <div class="name-header">
            <div class="name-info">
              <div class="name">${name}</div>
            </div>
            <div class="action-buttons">
              <button class="copy-btn" data-text="${name}">📋 คัดลอก</button>
            </div>
          </div>
          <div class="detail-row">
            <span><strong>ID:</strong> <strong>#${randomId}</strong></span>
          </div>
        `;

        card.querySelector('.copy-btn').addEventListener('click', function() {
          const btn = this;
          const text = btn.dataset.text;

          navigator.clipboard.writeText(text).then(() => {
            btn.classList.add('copied');
            btn.textContent = '✓ คัดลอกแล้ว';

            setTimeout(() => {
              btn.classList.remove('copied');
              btn.textContent = '📋 คัดลอก';
            }, 2000);
          });
        });

        resultsContainer.appendChild(card);
      }
    }

    generateBtn.addEventListener('click', generateNames);
    countInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') generateNames();
    });
  </script>
</body>

</html>
