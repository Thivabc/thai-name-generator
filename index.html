<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thai Name Generator</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --card: #eef6ff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --border: #dbeafe;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }

      .header {
        text-align: center;
        margin-bottom: 32px;
      }

      .header h1 {
        font-size: clamp(2rem, 4vw, 3.2rem);
        margin: 0 0 12px;
        font-weight: 800;
      }

      .header p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.08);
        padding: 28px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      label {
        display: block;
        font-size: 0.92rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }

      select, button {
        width: 100%;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        border: 1px solid var(--border);
      }

      select {
        background: #fff;
        color: var(--text);
      }

      button {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
      }

      .results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-top: 24px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 0.9rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .name {
        margin: 0;
        font-size: clamp(1.2rem, 2.5vw, 2rem);
        font-weight: 800;
        color: var(--text);
      }

      .note {
        margin-top: 24px;
        text-align: center;
        font-size: 0.9rem;
        color: var(--muted);
      }

      @media (max-width: 560px) {
        .panel { padding: 18px; }
        .controls { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Thai Name Generator</h1>
        <p>สร้างชื่อไทย ชื่ออังกฤษ และชื่อเล่น</p>
      </header>

      <main class="panel">
        <div class="controls">
          <div>
            <label for="gender">เพศ</label>
            <select id="gender">
              <option value="male">ชาย</option>
              <option value="female">หญิง</option>
              <option value="unisex">ไม่ระบุ</option>
            </select>
          </div>

          <div>
            <label for="style">สไตล์</label>
            <select id="style">
              <option value="classic">คลาสสิก</option>
              <option value="modern">ทันสมัย</option>
              <option value="cute">น่ารัก</option>
              <option value="royal">หรูหรา</option>
            </select>
          </div>

          <div>
            <label>&nbsp;</label>
            <button type="button" id="generateBtn">สุ่มชื่อ</button>
          </div>
        </div>

        <div class="results">
          <article class="card">
            <h3>ชื่อไทย</h3>
            <p class="name" id="thaiName">-</p>
          </article>

          <article class="card">
            <h3>ชื่ออังกฤษ</h3>
            <p class="name" id="englishName">-</p>
          </article>

          <article class="card">
            <h3>ชื่อเล่น</h3>
            <p class="name" id="nickname">-</p>
          </article>
        </div>

        <p class="note">Data loaded from GitHub module</p>
      </main>
    </div>

    <script type="module">
      import { thaiNames, englishNames, nicknames } from './data/names.js';

      function getRandomItem(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function generateName() {
        const gender = document.getElementById('gender').value;
        const style = document.getElementById('style').value;

        const thaiList = thaiNames[gender][style];
        const englishList = englishNames[gender];
        const nicknameList = nicknames[gender];

        document.getElementById('thaiName').textContent = getRandomItem(thaiList);
        document.getElementById('englishName').textContent = getRandomItem(englishList);
        document.getElementById('nickname').textContent = getRandomItem(nicknameList);
      }

      document.getElementById('generateBtn').addEventListener('click', generateName);
      generateName();
    </script>
  </body>
</html>
