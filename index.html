<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thai Name Generator</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top left,
          #f9ddf5 0%,
          transparent 38%
        ),
        radial-gradient(
          circle at top right,
          #e2d9ff 0%,
          transparent 38%
        ),
        linear-gradient(
          135deg,
          #fff5fb,
          #f5f1ff
        );

      color: #293142;

      padding: 28px 20px 50px;
    }

    .container {
      max-width: 1060px;
      margin: auto;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 13px;
      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      color: white;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #ec4899
        );

      box-shadow:
        0 9px 22px
        rgba(124, 58, 237, .22);
    }

    h1 {
      font-size: 40px;
      font-weight: 850;
      line-height: 1.15;
      margin-bottom: 10px;

      background:
        linear-gradient(
          90deg,
          #70219b,
          #b82291
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #747887;
      font-size: 15px;
      line-height: 1.6;
    }

    /* =========================
       MAIN PANEL
    ========================= */

    .panel {
      background: rgba(255, 255, 255, .96);
      border-radius: 22px;
      padding: 25px;

      box-shadow:
        0 20px 55px
        rgba(75, 45, 120, .11);
    }

    /* =========================
       FORM
    ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 18px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 750;
      margin-bottom: 8px;
    }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;

      background: #f0edff;
      border: 1px solid #e3dbff;
      padding: 5px;
      border-radius: 14px;
    }

    .type-btn {
      border: none;
      background: transparent;
      border-radius: 10px;
      padding: 11px 10px;

      font-size: 15px;
      font-weight: 750;
      color: #747989;

      cursor: pointer;
      transition: .2s;
    }

    .type-btn.active {
      background: white;
      color: #5927a4;

      box-shadow:
        0 3px 10px
        rgba(60, 40, 100, .09);
    }

    #count {
      width: 100%;
      height: 49px;

      border-radius: 13px;
      border: 1px solid #dedfe5;
      padding: 0 14px;

      font-size: 16px;
      outline: none;
      background: white;
      color: #293142;
    }

    #count:focus {
      border-color: #9347df;
    }

    #generateBtn {
      width: 100%;
      min-height: 52px;

      border: none;
      border-radius: 13px;

      background:
        linear-gradient(
          90deg,
          #7c3aed,
          #ed3b96
        );

      color: white;
      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 20px
        rgba(139, 57, 220, .20);

      transition: transform .2s, box-shadow .2s;
    }

    #generateBtn:hover {
      transform: translateY(-1px);

      box-shadow:
        0 10px 24px
        rgba(139, 57, 220, .26);
    }

    #generateBtn:active {
      transform: translateY(0);
    }

    /* =========================
       RESULTS
    ========================= */

    .results-section {
      margin-top: 27px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .results-header h2 {
      font-size: 24px;
      font-weight: 850;
    }

    .count-badge {
      background: #eee6ff;
      color: #5c25a9;
      padding: 7px 13px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    /* =========================
       NAME CARD
    ========================= */

    .name-card {
      background: white;
      border: 1px solid #e0e2e8;
      border-radius: 15px;
      padding: 15px;
      min-width: 0;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    .name-card:hover {
      border-color: #d0c4f7;

      box-shadow:
        0 6px 18px
        rgba(70, 40, 120, .07);
    }

    .name-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .full-name {
      font-size: 19px;
      font-weight: 850;
      color: #293142;
      line-height: 1.4;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .copy-buttons {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    /* =========================
       COPY BUTTONS
    ========================= */

    .copy-btn,
    .copy-id {
      border: 1px solid #dfe2e7;
      background: white;
      border-radius: 8px;
      padding: 7px 9px;

      font-family: inherit;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;

      cursor: pointer;
      transition: .2s;
    }

    .copy-btn:hover,
    .copy-id:hover {
      background: #faf9ff;
      border-color: #cfc1f5;
    }

    .copy-btn.copied,
    .copy-id.copied {
      color: #059669;
      border-color: #6ee7b7;
      background: #f0fdf9;
    }

    /* =========================
       ID ROW
    ========================= */

    .id-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      background: #f8f9fb;
      border: 1px solid #e1e4e9;
      border-radius: 10px;
      padding: 9px 10px;
      min-width: 0;
    }

    .id-text {
      color: #747b89;
      font-size: 12px;
      font-weight: 600;
      min-width: 0;
    }

    .id-text strong {
      display: inline-block;
      color: #293142;
      font-size: 14px;
      letter-spacing: .4px;
      overflow-wrap: anywhere;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {
      body {
        padding: 24px 16px 40px;
      }

      .container {
        max-width: 720px;
      }

      h1 {
        font-size: 36px;
      }

      .panel {
        padding: 21px;
      }

      .form-grid {
        grid-template-columns: 1fr 210px;
        gap: 14px;
      }

      #results {
        gap: 10px;
      }

      .name-card {
        padding: 12px;
      }

      .name-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .copy-buttons {
        width: 100%;
      }

      .copy-btn {
        flex: 1;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      body {
        padding: 20px 12px 35px;
      }

      header {
        margin-bottom: 22px;
      }

      .logo {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        font-size: 26px;
        margin-bottom: 11px;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 13px;
      }

      .panel {
        padding: 16px;
        border-radius: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .type-btn {
        padding: 10px 8px;
        font-size: 14px;
      }

      #count {
        height: 45px;
        font-size: 15px;
      }

      #generateBtn {
        min-height: 48px;
        font-size: 15px;
      }

      .results-section {
        margin-top: 23px;
      }

      .results-header {
        margin-bottom: 12px;
      }

      .results-header h2 {
        font-size: 20px;
      }

      .count-badge {
        font-size: 12px;
        padding: 6px 10px;
      }

      #results {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .name-card {
        padding: 13px;
      }

      .name-top {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        margin-bottom: 11px;
      }

      .full-name {
        font-size: 17px;
      }

      .copy-buttons {
        width: auto;
        gap: 5px;
      }

      .copy-btn,
      .copy-id {
        padding: 7px 8px;
        font-size: 10px;
      }

      .id-row {
        padding: 9px;
      }

      .id-text {
        font-size: 11px;
      }

      .id-text strong {
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {
      .name-top {
        flex-direction: column;
        align-items: stretch;
      }

      .copy-buttons {
        width: 100%;
      }

      .copy-btn {
        flex: 1;
      }

      .id-row {
        flex-direction: column;
        align-items: stretch;
      }

      .copy-id {
        width: 100%;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <header>
      <div class="logo">✦</div>

      <h1>Thai Name Generator</h1>

      <p class="subtitle">
        สร้างชื่อไทย ชื่ออังกฤษ แบบสุ่ม
        พร้อมเลขบัตรประชาชนจำลอง
      </p>
    </header>

    <!-- MAIN PANEL -->

    <main class="panel">

      <!-- FORM -->

      <div class="form-grid">

        <div>
          <label>ประเภทชื่อหลัก</label>

          <div class="type-selector">

            <button
              type="button"
              class="type-btn active"
              data-type="thai"
              aria-pressed="true"
            >
              🇹🇭 &nbsp;ชื่อไทย
            </button>

            <button
              type="button"
              class="type-btn"
              data-type="english"
              aria-pressed="false"
            >
              🇬🇧 &nbsp;English
            </button>

          </div>
        </div>

        <div>
          <label for="count">จำนวนชื่อ</label>

          <input
            id="count"
            type="number"
            min="1"
            max="100"
            value="10"
          >
        </div>

      </div>

      <!-- GENERATE BUTTON -->

      <button type="button" id="generateBtn">
        ✨ สุ่มชื่อ
      </button>

      <!-- RESULTS -->

      <section class="results-section">

        <div class="results-header">

          <h2>Generated Names</h2>

          <span id="countBadge" class="count-badge">
            10 names
          </span>

        </div>

        <div id="results"></div>

      </section>

    </main>

  </div>

  <script type="module">
    import {
      thaiNames,
      englishNames,
      thaiSurnames,
      englishSurnames
    } from "./data/names.js";

    let currentType = "thai";

    const countInput =
      document.getElementById("count");

    const generateBtn =
      document.getElementById("generateBtn");

    const results =
      document.getElementById("results");

    const countBadge =
      document.getElementById("countBadge");

    /* =========================
       RANDOM ITEM
    ========================= */

    function randomItem(array) {
      return array[
        Math.floor(Math.random() * array.length)
      ];
    }

    /* =========================
       DEMO ID
       NOT A REAL CITIZEN ID
    ========================= */

    function generateCitizenId() {
      const digits = [];

      digits.push(
        Math.floor(Math.random() * 8) + 1
      );

      for (let i = 1; i < 12; i++) {
        digits.push(
          Math.floor(Math.random() * 10)
        );
      }

      let sum = 0;

      for (let i = 0; i < 12; i++) {
        sum += digits[i] * (13 - i);
      }

      const checksum =
        (11 - (sum % 11)) % 10;

      digits.push(checksum);

      return digits.join("");
    }

    /* =========================
       GENERATE PROFILE
    ========================= */

    function generateProfile() {
      const gender =
        Math.random() < 0.5
          ? "male"
          : "female";

      let firstName;
      let surname;

      if (currentType === "thai") {
        firstName = randomItem(thaiNames[gender]);
        surname = randomItem(thaiSurnames);
      } else {
        firstName = randomItem(englishNames[gender]);
        surname = randomItem(englishSurnames);
      }

      return {
        firstName,
        surname,
        citizenId: generateCitizenId()
      };
    }

    /* =========================
       COPY TEXT
    ========================= */

    async function copyText(text, button) {
      const oldText = button.textContent;

      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea =
          document.createElement("textarea");

        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.select();

        const copied =
          document.execCommand("copy");

        textarea.remove();

        if (!copied) {
          button.textContent = "Copy failed";
          return;
        }
      }

      button.classList.add("copied");

      if (button.classList.contains("copy-id")) {
        button.textContent = "ID Copied ✓";
      } else if (oldText.includes("Surname")) {
        button.textContent = "Surname Copied ✓";
      } else {
        button.textContent = "Name Copied ✓";
      }

      setTimeout(() => {
        button.classList.remove("copied");
        button.textContent = oldText;
      }, 1500);
    }

    /* =========================
       CREATE CARD
    ========================= */

    function createCard(profile) {
      const card = document.createElement("div");
      card.className = "name-card";

      const nameTop = document.createElement("div");
      nameTop.className = "name-top";

      const fullName = document.createElement("div");
      fullName.className = "full-name";
      fullName.textContent =
        `${profile.firstName} ${profile.surname}`;

      const copyButtons = document.createElement("div");
      copyButtons.className = "copy-buttons";

      const copyNameBtn = document.createElement("button");
      copyNameBtn.type = "button";
      copyNameBtn.className = "copy-btn";
      copyNameBtn.textContent = "Copy Name";
      copyNameBtn.dataset.value = profile.firstName;

      const copySurnameBtn = document.createElement("button");
      copySurnameBtn.type = "button";
      copySurnameBtn.className = "copy-btn";
      copySurnameBtn.textContent = "Copy Surname";
      copySurnameBtn.dataset.value = profile.surname;

      copyButtons.append(copyNameBtn, copySurnameBtn);
      nameTop.append(fullName, copyButtons);

      const idRow = document.createElement("div");
      idRow.className = "id-row";

      const idText = document.createElement("div");
      idText.className = "id-text";
      idText.append("ID Card: ");

      const idStrong = document.createElement("strong");
      idStrong.textContent = profile.citizenId;
      idText.appendChild(idStrong);

      const copyIdBtn = document.createElement("button");
      copyIdBtn.type = "button";
      copyIdBtn.className = "copy-id";
      copyIdBtn.textContent = "Copy ID";
      copyIdBtn.dataset.value = profile.citizenId;

      idRow.append(idText, copyIdBtn);
      card.append(nameTop, idRow);

      card.querySelectorAll("[data-value]").forEach(button => {
        button.addEventListener("click", () => {
          copyText(button.dataset.value, button);
        });
      });

      return card;
    }

    /* =========================
       GENERATE NAMES
    ========================= */

    function generateNames() {
      let count = parseInt(countInput.value, 10);

      if (Number.isNaN(count)) {
        count = 10;
      }

      count = Math.max(1, Math.min(100, count));

      countInput.value = count;
      countBadge.textContent = `${count} names`;

      results.replaceChildren();

      const fragment = document.createDocumentFragment();

      for (let i = 0; i < count; i++) {
        const profile = generateProfile();
        fragment.appendChild(createCard(profile));
      }

      results.appendChild(fragment);
    }

    /* =========================
       TYPE SELECTOR
    ========================= */

    document.querySelectorAll(".type-btn").forEach(button => {
      button.addEventListener("click", () => {
        currentType = button.dataset.type;

        document.querySelectorAll(".type-btn").forEach(btn => {
          const isActive = btn === button;

          btn.classList.toggle("active", isActive);
          btn.setAttribute("aria-pressed", String(isActive));
        });

        generateNames();
      });
    });

    /* =========================
       GENERATE BUTTON
    ========================= */

    generateBtn.addEventListener("click", generateNames);

    countInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        generateNames();
      }
    });

    /* =========================
       INITIAL GENERATE
    ========================= */

    generateNames();
  </script>

</body>
</html>
