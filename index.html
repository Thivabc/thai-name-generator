<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thai Name Generator</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top left,
          #f9ddf5 0%,
          transparent 38%
        ),
        radial-gradient(
          circle at top right,
          #e2d9ff 0%,
          transparent 38%
        ),
        linear-gradient(
          135deg,
          #fff5fb,
          #f5f1ff
        );

      color: #293142;

      padding: 40px 20px 70px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      width: 74px;
      height: 74px;

      margin: 0 auto 18px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
      color: white;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #ec4899
        );

      box-shadow:
        0 12px 30px
        rgba(124, 58, 237, .25);
    }

    h1 {
      font-size: 50px;
      font-weight: 850;
      line-height: 1.1;

      margin-bottom: 14px;

      background:
        linear-gradient(
          90deg,
          #70219b,
          #b82291
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #747887;
      font-size: 18px;
    }

    /* =========================
       MAIN PANEL
    ========================= */

    .panel {
      background: rgba(255, 255, 255, .96);

      border-radius: 28px;

      padding: 32px;

      box-shadow:
        0 25px 70px
        rgba(75, 45, 120, .13);
    }

    /* =========================
       FORM
    ========================= */

    .form-grid {
      display: grid;

      grid-template-columns:
        1fr 300px;

      gap: 22px;

      margin-bottom: 20px;
    }

    label {
      display: block;

      font-size: 17px;
      font-weight: 750;

      margin-bottom: 10px;
    }

    .type-selector {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      background: #f0edff;

      border: 1px solid #e3dbff;

      padding: 6px;

      border-radius: 18px;
    }

    .type-btn {
      border: none;

      background: transparent;

      border-radius: 13px;

      padding: 14px;

      font-size: 17px;
      font-weight: 750;

      color: #747989;

      cursor: pointer;

      transition: .2s;
    }

    .type-btn.active {
      background: white;

      color: #5927a4;

      box-shadow:
        0 3px 12px
        rgba(60, 40, 100, .10);
    }

    #count {
      width: 100%;
      height: 64px;

      border-radius: 18px;

      border: 1px solid #dedfe5;

      padding: 0 18px;

      font-size: 18px;

      outline: none;
    }

    #count:focus {
      border-color: #9347df;
    }

    #generateBtn {
      width: 100%;
      height: 66px;

      border: none;

      border-radius: 17px;

      background:
        linear-gradient(
          90deg,
          #7c3aed,
          #ed3b96
        );

      color: white;

      font-size: 19px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 12px 28px
        rgba(139, 57, 220, .25);

      transition: .2s;
    }

    #generateBtn:hover {
      transform: translateY(-1px);
    }

    /* =========================
       RESULTS
    ========================= */

    .results-section {
      margin-top: 34px;
    }

    .results-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 20px;
    }

    .results-header h2 {
      font-size: 30px;
      font-weight: 850;
    }

    .count-badge {
      background: #eee6ff;

      color: #5c25a9;

      padding: 10px 18px;

      border-radius: 30px;

      font-weight: 800;
    }

    #results {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 16px;
    }

    /* =========================
       NAME CARD
    ========================= */

    .name-card {
      background: white;

      border:
        1px solid #e0e2e8;

      border-radius: 20px;

      padding: 20px;

      transition: .2s;
    }

    .name-card:hover {
      border-color: #d0c4f7;

      box-shadow:
        0 8px 25px
        rgba(70, 40, 120, .08);
    }

    .name-top {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 12px;

      margin-bottom: 18px;
    }

    .full-name {
      font-size: 23px;

      font-weight: 850;

      color: #293142;

      line-height: 1.3;
    }

    .copy-buttons {
      display: flex;

      gap: 8px;
    }

    /* =========================
       COPY BUTTON
    ========================= */

    .copy-btn,
    .copy-id {
      border:
        1px solid #dfe2e7;

      background: white;

      border-radius: 9px;

      padding: 9px 13px;

      font-size: 13px;

      font-weight: 750;

      white-space: nowrap;

      cursor: pointer;

      transition: .2s;
    }

    .copy-btn:hover,
    .copy-id:hover {
      background: #faf9ff;
    }

    /* =========================
       COPIED STATE
    ========================= */

    .copy-btn.copied,
    .copy-id.copied {

      color: #059669;

      border-color: #6ee7b7;

      background: #f0fdf9;

    }

    /* =========================
       ID ROW
    ========================= */

    .id-row {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 12px;

      background: #f8f9fb;

      border:
        1px solid #e1e4e9;

      border-radius: 13px;

      padding: 12px 14px;
    }

    .id-text {
      color: #747b89;

      font-size: 15px;

      font-weight: 600;
    }

    .id-text strong {
      color: #293142;

      font-size: 17px;

      letter-spacing: .6px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      body {
        padding:
          25px 12px 50px;
      }

      h1 {
        font-size: 36px;
      }

      .panel {
        padding: 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      #results {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 520px) {

      .name-top {
        flex-direction: column;

        align-items: stretch;
      }

      .copy-buttons {
        width: 100%;
      }

      .copy-btn {
        flex: 1;
      }

      .id-row {
        flex-direction: column;

        align-items: stretch;
      }

      .copy-id {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <!-- =========================
         HEADER
    ========================= -->

    <header>

      <div class="logo">
        ✦
      </div>

      <h1>
        Thai Name Generator
      </h1>

      <p class="subtitle">
        สร้างชื่อไทย ชื่ออังกฤษ แบบสุ่ม
        พร้อมเลขบัตรประชาชนจำลอง
      </p>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="panel">


      <!-- FORM -->

      <div class="form-grid">


        <div>

          <label>
            ประเภทชื่อหลัก
          </label>

          <div class="type-selector">

            <button
              class="type-btn active"
              data-type="thai"
            >
              🇹🇭 &nbsp;ชื่อไทย
            </button>

            <button
              class="type-btn"
              data-type="english"
            >
              🇬🇧 &nbsp;English
            </button>

          </div>

        </div>


        <div>

          <label>
            จำนวนชื่อ
          </label>

          <input
            id="count"
            type="number"
            min="1"
            max="100"
            value="10"
          >

        </div>


      </div>


      <!-- GENERATE BUTTON -->

      <button id="generateBtn">
        ✨ สุ่มชื่อ
      </button>


      <!-- RESULTS -->

      <section class="results-section">


        <div class="results-header">

          <h2>
            Generated Names
          </h2>

          <span
            id="countBadge"
            class="count-badge"
          >
            10 names
          </span>

        </div>


        <div id="results"></div>


      </section>


    </main>


  </div>


  <script type="module">

    import {
      thaiNames,
      englishNames,
      thaiSurnames,
      englishSurnames
    } from "./data/names.js";


    let currentType = "thai";


    const countInput =
      document.getElementById("count");


    const generateBtn =
      document.getElementById("generateBtn");


    const results =
      document.getElementById("results");


    const countBadge =
      document.getElementById("countBadge");


    /* =========================
       RANDOM ITEM
    ========================= */

    function randomItem(array) {

      return array[
        Math.floor(
          Math.random() * array.length
        )
      ];

    }


    /* =========================
       CITIZEN ID
    ========================= */

    function generateCitizenId() {

      const digits = [];


      /*
        First digit:
        1 - 8
      */

      digits.push(
        Math.floor(
          Math.random() * 8
        ) + 1
      );


      /*
        Digits 2 - 12
      */

      for (
        let i = 1;
        i < 12;
        i++
      ) {

        digits.push(
          Math.floor(
            Math.random() * 10
          )
        );

      }


      /*
        Checksum

        digit 1 × 13
        digit 2 × 12
        ...
        digit 12 × 2
      */

      let sum = 0;


      for (
        let i = 0;
        i < 12;
        i++
      ) {

        sum +=
          digits[i] *
          (13 - i);

      }


      const checksum =
        (11 - (sum % 11)) % 10;


      digits.push(checksum);


      return digits.join("");

    }


    /* =========================
       GENERATE PROFILE
    ========================= */

    function generateProfile() {

      const gender =
        Math.random() < 0.5
          ? "male"
          : "female";


      let firstName;
      let surname;


      if (
        currentType === "thai"
      ) {

        firstName =
          randomItem(
            thaiNames[gender]
          );


        surname =
          randomItem(
            thaiSurnames
          );

      } else {

        firstName =
          randomItem(
            englishNames[gender]
          );


        surname =
          randomItem(
            englishSurnames
          );

      }


      return {

        firstName,

        surname,

        citizenId:
          generateCitizenId()

      };

    }


    /* =========================
       COPY TEXT
    ========================= */

    async function copyText(
      text,
      button
    ) {

      const oldText =
        button.textContent;


      try {

        await navigator
          .clipboard
          .writeText(text);

      } catch {

        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          text;


        document.body.appendChild(
          textarea
        );


        textarea.select();


        document.execCommand(
          "copy"
        );


        textarea.remove();

      }


      /*
        Add green copied state
      */

      button.classList.add(
        "copied"
      );


      /*
        Different message
      */

      if (
        button.classList.contains(
          "copy-id"
        )
      ) {

        button.textContent =
          "ID Copied ✓";

      } else if (
        oldText.includes(
          "Surname"
        )
      ) {

        button.textContent =
          "Surname Copied ✓";

      } else {

        button.textContent =
          "Name Copied ✓";

      }


      /*
        Return to normal
        after 1.5 seconds
      */

      setTimeout(() => {

        button.classList.remove(
          "copied"
        );


        button.textContent =
          oldText;

      }, 1500);

    }


    /* =========================
       CREATE CARD
    ========================= */

    function createCard(profile) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "name-card";


      const fullName =
        `${profile.firstName} ${profile.surname}`;


      card.innerHTML = `

        <div class="name-top">

          <div class="full-name">
            ${fullName}
          </div>


          <div class="copy-buttons">

            <button
              class="copy-btn"
              data-value="${profile.firstName}"
            >
              Copy Name
            </button>


            <button
              class="copy-btn"
              data-value="${profile.surname}"
            >
              Copy Surname
            </button>

          </div>

        </div>


        <div class="id-row">

          <div class="id-text">

            ID Card:

            <strong>
              ${profile.citizenId}
            </strong>

          </div>


          <button
            class="copy-id"
            data-value="${profile.citizenId}"
          >
            Copy ID
          </button>

        </div>

      `;


      /*
        Attach copy events
      */

      card
        .querySelectorAll(
          "[data-value]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              copyText(
                button.dataset.value,
                button
              );

            }
          );

        });


      return card;

    }


    /* =========================
       GENERATE NAMES
    ========================= */

    function generateNames() {


      let count =
        parseInt(
          countInput.value
        );


      if (
        Number.isNaN(count)
      ) {

        count = 10;

      }


      /*
        Maximum 100
      */

      count =
        Math.max(
          1,
          Math.min(
            100,
            count
          )
        );


      countInput.value =
        count;


      countBadge.textContent =
        `${count} names`;


      /*
        Clear old results
      */

      results.innerHTML =
        "";


      /*
        Generate cards
      */

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const profile =
          generateProfile();


        results.appendChild(
          createCard(profile)
        );

      }

    }


    /* =========================
       TYPE SELECTOR
    ========================= */

    document
      .querySelectorAll(
        ".type-btn"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {


            document
              .querySelectorAll(
                ".type-btn"
              )
              .forEach(btn => {

                btn.classList.remove(
                  "active"
                );

              });


            button.classList.add(
              "active"
            );


            currentType =
              button.dataset.type;


            generateNames();

          }
        );

      });


    /* =========================
       GENERATE BUTTON
    ========================= */

    generateBtn.addEventListener(
      "click",
      generateNames
    );


    /* =========================
       INITIAL GENERATE
    ========================= */

    generateNames();

  </script>

</body>

</html>
