<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Thai Name Generator</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top left,
          rgba(244, 194, 255, 0.45),
          transparent 35%
        ),
        radial-gradient(
          circle at top right,
          rgba(196, 181, 253, 0.45),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #fff1f8 0%,
          #f8f4ff 50%,
          #eee8ff 100%
        );

      color: #273043;
      padding: 40px 20px 60px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    /* HEADER */

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      width: 74px;
      height: 74px;

      margin: 0 auto 20px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #ec4899
        );

      box-shadow:
        0 15px 35px rgba(124, 58, 237, 0.25);
    }

    header h1 {
      font-size: 48px;
      line-height: 1.1;
      font-weight: 800;

      background:
        linear-gradient(
          90deg,
          #7223a1,
          #c0258d
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      margin-bottom: 15px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 19px;
      font-weight: 500;
    }

    /* MAIN PANEL */

    .panel {
      background: rgba(255, 255, 255, 0.94);

      border-radius: 28px;

      padding: 32px;

      box-shadow:
        0 25px 70px rgba(90, 55, 130, 0.15);

      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* FORM */

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;

      margin-bottom: 20px;
    }

    .field label {
      display: block;

      font-size: 17px;
      font-weight: 700;

      margin-bottom: 10px;
      color: #293142;
    }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;

      padding: 6px;

      background: #f0edff;

      border: 1px solid #e6ddff;

      border-radius: 18px;
    }

    .type-btn {
      border: none;

      background: transparent;

      padding: 14px;

      border-radius: 13px;

      font-size: 17px;
      font-weight: 700;

      color: #707586;

      cursor: pointer;

      transition: 0.2s;
    }

    .type-btn.active {
      background: white;

      color: #5d28a8;

      box-shadow:
        0 3px 12px rgba(80, 50, 150, 0.12);
    }

    input {
      width: 100%;

      height: 64px;

      border-radius: 18px;

      border: 1px solid #dddfe6;

      background: white;

      padding: 0 18px;

      font-size: 18px;

      color: #293142;

      outline: none;
    }

    input:focus {
      border-color: #9b4de3;

      box-shadow:
        0 0 0 4px rgba(155, 77, 227, 0.1);
    }

    /* GENERATE BUTTON */

    #generateBtn {
      width: 100%;

      border: none;

      height: 66px;

      border-radius: 17px;

      background:
        linear-gradient(
          90deg,
          #7c3aed,
          #ec3c96
        );

      color: white;

      font-size: 19px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 12px 25px rgba(156, 56, 218, 0.25);

      transition: 0.2s;
    }

    #generateBtn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 16px 30px rgba(156, 56, 218, 0.3);
    }

    #generateBtn:active {
      transform: translateY(0);
    }

    /* RESULTS */

    .results-section {
      margin-top: 32px;
    }

    .results-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .results-header h2 {
      font-size: 28px;
      font-weight: 800;
    }

    .count-badge {
      background: #eee7ff;

      color: #5d28a8;

      padding: 10px 17px;

      border-radius: 25px;

      font-size: 16px;
      font-weight: 800;
    }

    #results {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 16px;
    }

    /* CARD */

    .name-card {
      background: white;

      border: 1px solid #e0e3e8;

      border-radius: 20px;

      padding: 20px;

      transition: 0.2s;
    }

    .name-card:hover {
      border-color: #cfc4ed;

      box-shadow:
        0 8px 25px rgba(60, 40, 100, 0.08);
    }

    .name-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 14px;
    }

    .name {
      font-size: 22px;

      font-weight: 800;

      color: #263042;

      word-break: break-word;
    }

    .action-buttons {
      display: flex;

      gap: 7px;

      flex-shrink: 0;
    }

    .copy-btn {
      border: 1px solid #e0e3e8;

      background: #fff;

      border-radius: 10px;

      padding: 9px 12px;

      font-size: 13px;

      font-weight: 700;

      color: #293142;

      cursor: pointer;

      transition: 0.2s;
    }

    .copy-btn:hover {
      background: #f7f5ff;

      border-color: #c9b9f3;
    }

    .id-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      background: #f8f9fb;

      border: 1px solid #e2e5ea;

      border-radius: 13px;

      padding: 12px 13px;
    }

    .id-number {
      color: #707786;

      font-size: 14px;

      font-weight: 600;
    }

    .id-number strong {
      color: #263042;

      font-size: 16px;

      letter-spacing: 0.5px;
    }

    .copy-id {
      border: 1px solid #dfe2e7;

      background: white;

      border-radius: 9px;

      padding: 8px 12px;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      color: #293142;
    }

    .copy-id:hover {
      background: #f3f1ff;
    }

    /* EMPTY */

    .empty-state {
      text-align: center;

      padding: 50px 20px;

      color: #7b8190;
    }

    .empty-state .emoji {
      font-size: 45px;

      margin-bottom: 10px;
    }

    /* RESPONSIVE */

    @media (max-width: 800px) {
      body {
        padding: 25px 12px 40px;
      }

      header h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 16px;
      }

      .panel {
        padding: 20px;
        border-radius: 22px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      #results {
        grid-template-columns: 1fr;
      }

      .name-header {
        align-items: flex-start;
      }
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 30px;
      }

      .name-header {
        flex-direction: column;
      }

      .action-buttons {
        width: 100%;
      }

      .copy-btn {
        flex: 1;
      }

      .id-row {
        flex-direction: column;
        align-items: stretch;
      }

      .copy-id {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">✦</div>

    <h1>Thai Name Generator</h1>

    <p class="subtitle">
      สร้างชื่อไทย ชื่ออังกฤษ แบบสุ่ม พร้อมเลขบัตรประชาชนจำลอง
    </p>
  </header>


  <main class="panel">

    <!-- FORM -->

    <div class="form-grid">

      <div class="field">

        <label>ประเภทชื่อ</label>

        <div class="type-selector">

          <button
            class="type-btn active"
            data-type="thai"
          >
            🇹🇭 &nbsp;ชื่อไทย
          </button>

          <button
            class="type-btn"
            data-type="english"
          >
            🇬🇧 &nbsp;English
          </button>

        </div>

      </div>


      <div class="field">

        <label>จำนวนชื่อ</label>

        <input
          type="number"
          id="count"
          min="1"
          max="20"
          value="10"
        />

      </div>

    </div>


    <button id="generateBtn">
      ✨ สุ่มชื่อ
    </button>


    <!-- RESULTS -->

    <section class="results-section">

      <div class="results-header">

        <h2>ชื่อที่สร้างขึ้น</h2>

        <span
          class="count-badge"
          id="countBadge"
        >
          10 ชื่อ
        </span>

      </div>


      <div id="results"></div>

    </section>

  </main>

</div>


<script type="module">

  import {
    thaiNames,
    englishNames,
    thaiSurnames,
    englishSurnames
  } from "./data/names.js";


  let currentType = "thai";


  const countInput =
    document.getElementById("count");

  const generateBtn =
    document.getElementById("generateBtn");

  const results =
    document.getElementById("results");

  const countBadge =
    document.getElementById("countBadge");


  /*
   * สุ่มชื่อจาก gender + style
   */

  function getRandomFirstName(names) {

    const genders =
      Object.keys(names);

    const gender =
      genders[
        Math.floor(
          Math.random() * genders.length
        )
      ];

    const styles =
      Object.keys(names[gender]);

    const style =
      styles[
        Math.floor(
          Math.random() * styles.length
        )
      ];

    const list =
      names[gender][style];

    const firstName =
      list[
        Math.floor(
          Math.random() * list.length
        )
      ];

    return {
      firstName,
      gender
    };
  }


  /*
   * สุ่มนามสกุล
   */

  function getRandomSurname(surnames) {

    return surnames[
      Math.floor(
        Math.random() * surnames.length
      )
    ];
  }


  /*
   * สร้างเลขบัตรประชาชนจำลอง
   */

  function generateCitizenId() {

    let id = "";

    for (let i = 0; i < 13; i++) {

      id += Math.floor(
        Math.random() * 10
      );

    }

    return id;
  }


  /*
   * สุ่มข้อมูลหนึ่งรายการ
   */

  function generateProfile() {

    const thai =
      getRandomFirstName(thaiNames);

    const english =
      getRandomFirstName(englishNames);


    return {

      thaiName:
        thai.firstName,

      thaiSurname:
        getRandomSurname(thaiSurnames),

      englishName:
        english.firstName,

      englishSurname:
        getRandomSurname(englishSurnames),

      citizenId:
        generateCitizenId()

    };

  }


  /*
   * สร้าง Card
   */

  function createCard(profile) {

    const card =
      document.createElement("div");

    card.className =
      "name-card";


    /*
     * ถ้าเลือกไทย
     * แสดงชื่อไทย
     *
     * ถ้าเลือก English
     * แสดงชื่ออังกฤษ
     */

    const displayName =
      currentType === "thai"

        ? `${profile.thaiName} ${profile.thaiSurname}`

        : `${profile.englishName} ${profile.englishSurname}`;


    card.innerHTML = `

      <div class="name-header">

        <div class="name">
          ${displayName}
        </div>

        <div class="action-buttons">

          <button
            class="copy-btn"
            data-copy="${displayName}"
          >
            คัดลอกชื่อ
          </button>

          <button
            class="copy-btn"
            data-copy="${
              currentType === "thai"
                ? profile.thaiSurname
                : profile.englishSurname
            }"
          >
            คัดลอกนามสกุล
          </button>

        </div>

      </div>


      <div class="id-row">

        <div class="id-number">

          เลขบัตรประชาชน:

          <strong>
            ${profile.citizenId}
          </strong>

        </div>

        <button
          class="copy-id"
          data-copy="${profile.citizenId}"
        >
          คัดลอกเลขบัตร
        </button>

      </div>

    `;


    /*
     * Copy buttons
     */

    card
      .querySelectorAll("[data-copy]")
      .forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            const text =
              button.dataset.copy;

            try {

              await navigator.clipboard
                .writeText(text);

              const oldText =
                button.textContent;

              button.textContent =
                "✓ คัดลอกแล้ว";

              setTimeout(() => {

                button.textContent =
                  oldText;

              }, 1200);

            } catch (error) {

              alert(
                "ไม่สามารถคัดลอกได้"
              );

            }

          }
        );

      });


    return card;

  }


  /*
   * Generate
   */

  function generateNames() {

    let count =
      parseInt(
        countInput.value
      ) || 10;


    count =
      Math.max(
        1,
        Math.min(20, count)
      );


    countInput.value =
      count;


    countBadge.textContent =
      `${count} ชื่อ`;


    results.innerHTML = "";


    for (
      let i = 0;
      i < count;
      i++
    ) {

      const profile =
        generateProfile();

      const card =
        createCard(profile);

      results.appendChild(card);

    }

  }


  /*
   * เปลี่ยนภาษา
   */

  document
    .querySelectorAll(".type-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".type-btn")
            .forEach(btn => {

              btn.classList.remove(
                "active"
              );

            });


          button.classList.add(
            "active"
          );


          currentType =
            button.dataset.type;


          generateNames();

        }
      );

    });


  /*
   * ปุ่มสุ่ม
   */

  generateBtn.addEventListener(
    "click",
    generateNames
  );


  /*
   * Enter ในช่องจำนวน
   */

  countInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        generateNames();

      }

    }
  );


  /*
   * สร้างชื่อทันทีเมื่อเปิดเว็บ
   */

  generateNames();

</script>

</body>
</html>
