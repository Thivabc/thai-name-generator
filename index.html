<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Thai Name Generator</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg"
  >

  <link
    rel="shortcut icon"
    href="favicon.svg"
  >

  <link
    rel="apple-touch-icon"
    href="favicon.svg"
  >


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

      min-height: 100vh;

      background:

        radial-gradient(
          circle at top left,
          rgba(244, 194, 255, 0.45),
          transparent 35%
        ),

        radial-gradient(
          circle at top right,
          rgba(196, 181, 253, 0.45),
          transparent 35%
        ),

        linear-gradient(
          135deg,
          #fff1f8 0%,
          #f8f4ff 50%,
          #eee8ff 100%
        );

      color: #273043;

      padding: 40px 20px 60px;

    }


    .container {

      max-width: 1200px;

      margin: auto;

    }


    /* HEADER */

    header {

      text-align: center;

      margin-bottom: 35px;

    }


    .logo {

      width: 74px;
      height: 74px;

      margin: 0 auto 20px;

      border-radius: 22px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 38px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #ec4899
        );

      box-shadow:
        0 15px 35px
        rgba(124, 58, 237, 0.25);

    }


    header h1 {

      font-size: 48px;

      line-height: 1.1;

      font-weight: 800;

      background:
        linear-gradient(
          90deg,
          #7223a1,
          #c0258d
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      margin-bottom: 15px;

    }


    .subtitle {

      color: #6b7280;

      font-size: 19px;

      font-weight: 500;

    }


    /* PANEL */

    .panel {

      background:
        rgba(255, 255, 255, 0.94);

      border-radius: 28px;

      padding: 32px;

      box-shadow:
        0 25px 70px
        rgba(90, 55, 130, 0.15);

      border:
        1px solid
        rgba(255,255,255,0.8);

    }


    /* FORM */

    .form-grid {

      display: grid;

      grid-template-columns:
        1fr 320px;

      gap: 20px;

      margin-bottom: 20px;

    }


    .field label {

      display: block;

      font-size: 17px;

      font-weight: 700;

      margin-bottom: 10px;

      color: #293142;

    }


    .type-selector {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      padding: 6px;

      background: #f0edff;

      border:
        1px solid #e6ddff;

      border-radius: 18px;

    }


    .type-btn {

      border: none;

      background: transparent;

      padding: 14px;

      border-radius: 13px;

      font-size: 17px;

      font-weight: 700;

      color: #707586;

      cursor: pointer;

      transition: 0.2s;

    }


    .type-btn.active {

      background: white;

      color: #5d28a8;

      box-shadow:
        0 3px 12px
        rgba(80, 50, 150, 0.12);

    }


    input {

      width: 100%;

      height: 64px;

      border-radius: 18px;

      border:
        1px solid #dddfe6;

      background: white;

      padding: 0 18px;

      font-size: 18px;

      color: #293142;

      outline: none;

    }


    input:focus {

      border-color: #9b4de3;

      box-shadow:
        0 0 0 4px
        rgba(155, 77, 227, 0.1);

    }


    /* GENERATE */

    #generateBtn {

      width: 100%;

      height: 66px;

      border: none;

      border-radius: 17px;

      background:
        linear-gradient(
          90deg,
          #7c3aed,
          #ec3c96
        );

      color: white;

      font-size: 19px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 12px 25px
        rgba(156, 56, 218, 0.25);

      transition: 0.2s;

    }


    #generateBtn:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 16px 30px
        rgba(156, 56, 218, 0.3);

    }


    /* RESULTS */

    .results-section {

      margin-top: 32px;

    }


    .results-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 20px;

    }


    .results-header h2 {

      font-size: 28px;

      font-weight: 800;

    }


    .count-badge {

      background: #eee7ff;

      color: #5d28a8;

      padding: 10px 17px;

      border-radius: 25px;

      font-size: 16px;

      font-weight: 800;

    }


    #results {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 16px;

    }


    /* CARD */

    .name-card {

      background: white;

      border:
        1px solid #e0e3e8;

      border-radius: 20px;

      padding: 20px;

      transition: 0.2s;

    }


    .name-card:hover {

      border-color: #cfc4ed;

      box-shadow:
        0 8px 25px
        rgba(60,40,100,0.08);

    }


    .card-top {

      display: flex;

      justify-content:
        space-between;

      align-items: flex-start;

      gap: 15px;

      margin-bottom: 15px;

    }


    .main-name {

      font-size: 23px;

      font-weight: 800;

      color: #263042;

      line-height: 1.35;

    }


    .main-name small {

      display: block;

      margin-top: 3px;

      font-size: 13px;

      color: #858b98;

      font-weight: 600;

    }


    .copy-main {

      white-space: nowrap;

      border:
        1px solid #e0e3e8;

      background: white;

      border-radius: 10px;

      padding: 9px 12px;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

    }


    /* DETAIL */

    .detail-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-bottom: 12px;

    }


    .detail-box {

      background: #fafbfc;

      border:
        1px solid #e5e7eb;

      border-radius: 12px;

      padding: 11px 12px;

      min-width: 0;

    }


    .detail-label {

      display: block;

      color: #7b8190;

      font-size: 12px;

      font-weight: 700;

      margin-bottom: 4px;

    }


    .detail-value {

      color: #293142;

      font-size: 15px;

      font-weight: 700;

      word-break: break-word;

    }


    .detail-action {

      margin-top: 7px;

      border:
        1px solid #e0e3e8;

      background: white;

      border-radius: 8px;

      padding: 6px 9px;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

    }


    /* CITIZEN ID */

    .id-row {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 10px;

      background: #f8f9fb;

      border:
        1px solid #e2e5ea;

      border-radius: 13px;

      padding: 12px 13px;

    }


    .id-number {

      color: #707786;

      font-size: 14px;

      font-weight: 600;

    }


    .id-number strong {

      color: #263042;

      font-size: 16px;

      letter-spacing: 0.7px;

    }


    .copy-id {

      border:
        1px solid #dfe2e7;

      background: white;

      border-radius: 9px;

      padding: 8px 12px;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      color: #293142;

      white-space: nowrap;

    }


    /* RESPONSIVE */

    @media (max-width: 800px) {

      body {

        padding:
          25px 12px 40px;

      }


      header h1 {

        font-size: 36px;

      }


      .subtitle {

        font-size: 16px;

      }


      .panel {

        padding: 20px;

        border-radius: 22px;

      }


      .form-grid {

        grid-template-columns: 1fr;

      }


      #results {

        grid-template-columns: 1fr;

      }

    }


    @media (max-width: 520px) {

      header h1 {

        font-size: 30px;

      }


      .card-top {

        flex-direction: column;

      }


      .copy-main {

        width: 100%;

      }


      .detail-grid {

        grid-template-columns: 1fr;

      }


      .id-row {

        flex-direction: column;

        align-items: stretch;

      }


      .copy-id {

        width: 100%;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <header>

    <div class="logo">
      ✦
    </div>

    <h1>
      Thai Name Generator
    </h1>

    <p class="subtitle">
      สร้างชื่อไทย ชื่ออังกฤษ แบบสุ่ม
      พร้อมเลขบัตรประชาชนจำลอง
    </p>

  </header>


  <main class="panel">


    <!-- SETTINGS -->

    <div class="form-grid">


      <div class="field">

        <label>
          ประเภทชื่อหลัก
        </label>


        <div class="type-selector">


          <button
            class="type-btn active"
            data-type="thai"
          >
            🇹🇭 &nbsp;ชื่อไทย
          </button>


          <button
            class="type-btn"
            data-type="english"
          >
            🇬🇧 &nbsp;English
          </button>


        </div>

      </div>


      <div class="field">

        <label>
          จำนวนชื่อ
        </label>


        <input
          type="number"
          id="count"
          min="1"
          max="100"
          value="10"
        >

      </div>


    </div>


    <button id="generateBtn">
      ✨ สุ่มชื่อ
    </button>


    <!-- RESULTS -->

    <section class="results-section">


      <div class="results-header">

        <h2>
          ชื่อที่สร้างขึ้น
        </h2>


        <span
          class="count-badge"
          id="countBadge"
        >
          10 ชื่อ
        </span>

      </div>


      <div id="results"></div>


    </section>


  </main>


</div>


<script type="module">


  import {

    thaiNames,
    englishNames,
    thaiSurnames,
    englishSurnames

  } from "./data/names.js";


  let currentType = "thai";


  const countInput =
    document.getElementById("count");


  const generateBtn =
    document.getElementById("generateBtn");


  const results =
    document.getElementById("results");


  const countBadge =
    document.getElementById("countBadge");


  // ==================================================
  // RANDOM
  // ==================================================

  function randomItem(array) {

    return array[
      Math.floor(
        Math.random() * array.length
      )
    ];

  }


  // ==================================================
  // SHUFFLE
  // ==================================================

  function shuffle(array) {

    const result = [...array];

    for (
      let i = result.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        result[i],
        result[j]
      ] =
      [
        result[j],
        result[i]
      ];

    }

    return result;

  }


  // ==================================================
  // THAI CITIZEN ID
  //
  // 13 digits
  // Digit 13 = checksum
  // ==================================================

  function generateCitizenId() {

    const digits = [];


    /*
     * Digit 1
     *
     * ใช้ 1-8
     * เพื่อไม่ให้ขึ้นต้นด้วย 0
     */

    digits.push(
      Math.floor(
        Math.random() * 8
      ) + 1
    );


    /*
     * Digits 2-12
     */

    for (
      let i = 1;
      i < 12;
      i++
    ) {

      digits.push(
        Math.floor(
          Math.random() * 10
        )
      );

    }


    /*
     * Checksum
     *
     * sum =
     * digit1 × 13
     * digit2 × 12
     * ...
     * digit12 × 2
     *
     * checksum =
     * (11 - sum % 11) % 10
     */

    let sum = 0;


    for (
      let i = 0;
      i < 12;
      i++
    ) {

      sum +=
        digits[i] *
        (13 - i);

    }


    const checksum =
      (11 - (sum % 11)) % 10;


    digits.push(checksum);


    return digits.join("");

  }


  // ==================================================
  // CREATE PROFILE
  // ==================================================

  function generateProfile() {


    /*
     * สุ่ม gender เดียวกัน
     * เพื่อให้ชื่อไทย/อังกฤษ
     * เป็นเพศเดียวกัน
     */

    const gender =
      Math.random() < 0.5
        ? "male"
        : "female";


    const thaiName =
      randomItem(
        thaiNames[gender]
      );


    const englishName =
      randomItem(
        englishNames[gender]
      );


    const thaiSurname =
      randomItem(
        thaiSurnames
      );


    const englishSurname =
      randomItem(
        englishSurnames
      );


    return {

      thaiName,

      thaiSurname,

      englishName,

      englishSurname,

      citizenId:
        generateCitizenId()

    };

  }


  // ==================================================
  // CREATE CARD
  // ==================================================

  function createCard(
    profile,
    index
  ) {


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "name-card";


    const mainName =
      currentType === "thai"

        ? `${profile.thaiName} ${profile.thaiSurname}`

        : `${profile.englishName} ${profile.englishSurname}`;


    const mainLabel =
      currentType === "thai"

        ? "🇹🇭 ชื่อไทย"

        : "🇬🇧 English Name";


    card.innerHTML = `

      <div class="card-top">

        <div class="main-name">

          ${mainName}

          <small>
            ${mainLabel} · #${index}
          </small>

        </div>


        <button
          class="copy-main"
          data-copy="${mainName}"
        >
          คัดลอกชื่อ
        </button>

      </div>


      <div class="detail-grid">


        <div class="detail-box">

          <span class="detail-label">
            🇹🇭 ชื่อไทย
          </span>

          <div class="detail-value">
            ${profile.thaiName}
          </div>

          <button
            class="detail-action"
            data-copy="${profile.thaiName}"
          >
            คัดลอก
          </button>

        </div>


        <div class="detail-box">

          <span class="detail-label">
            🇹🇭 นามสกุลไทย
          </span>

          <div class="detail-value">
            ${profile.thaiSurname}
          </div>

          <button
            class="detail-action"
            data-copy="${profile.thaiSurname}"
          >
            คัดลอก
          </button>

        </div>


        <div class="detail-box">

          <span class="detail-label">
            🇬🇧 First Name
          </span>

          <div class="detail-value">
            ${profile.englishName}
          </div>

          <button
            class="detail-action"
            data-copy="${profile.englishName}"
          >
            Copy
          </button>

        </div>


        <div class="detail-box">

          <span class="detail-label">
            🇬🇧 Last Name
          </span>

          <div class="detail-value">
            ${profile.englishSurname}
          </div>

          <button
            class="detail-action"
            data-copy="${profile.englishSurname}"
          >
            Copy
          </button>

        </div>


      </div>


      <div class="id-row">

        <div class="id-number">

          เลขบัตรประชาชน:

          <strong>
            ${profile.citizenId}
          </strong>

        </div>


        <button
          class="copy-id"
          data-copy="${profile.citizenId}"
        >
          คัดลอกเลขบัตร
        </button>

      </div>

    `;


    /*
     * COPY
     */

    card
      .querySelectorAll(
        "[data-copy]"
      )
      .forEach(button => {


        button.addEventListener(
          "click",
          async () => {


            const text =
              button.dataset.copy;


            try {


              await navigator
                .clipboard
                .writeText(text);


              const oldText =
                button.textContent;


              button.textContent =
                "✓ คัดลอกแล้ว";


              setTimeout(
                () => {

                  button.textContent =
                    oldText;

                },
                1200
              );


            } catch (error) {


              /*
               * fallback
               */

              const textarea =
                document.createElement(
                  "textarea"
                );


              textarea.value =
                text;


              document.body.appendChild(
                textarea
              );


              textarea.select();


              document.execCommand(
                "copy"
              );


              textarea.remove();


              const oldText =
                button.textContent;


              button.textContent =
                "✓ คัดลอกแล้ว";


              setTimeout(
                () => {

                  button.textContent =
                    oldText;

                },
                1200
              );

            }

          }
        );

      });


    return card;

  }


  // ==================================================
  // GENERATE NAMES
  // ==================================================

  function generateNames() {


    let count =
      parseInt(
        countInput.value
      );


    if (
      isNaN(count)
    ) {

      count = 10;

    }


    /*
     * จำกัด 1-100
     */

    count =
      Math.max(
        1,
        Math.min(
          100,
          count
        )
      );


    countInput.value =
      count;


    countBadge.textContent =
      `${count} ชื่อ`;


    results.innerHTML =
      "";


    /*
     * สร้าง 100 รายการ
     *
     * แต่ไม่รับประกันว่า
     * ชื่อ+นามสกุลทั้งหมดจะไม่ซ้ำ
     * เพราะฐานข้อมูลมีจำนวนจำกัด
     */

    const profiles = [];


    for (
      let i = 0;
      i < count;
      i++
    ) {

      profiles.push(
        generateProfile()
      );

    }


    profiles.forEach(
      (profile, index) => {

        results.appendChild(
          createCard(
            profile,
            index + 1
          )
        );

      }
    );

  }


  // ==================================================
  // LANGUAGE BUTTON
  // ==================================================

  document
    .querySelectorAll(
      ".type-btn"
    )
    .forEach(button => {


      button.addEventListener(
        "click",
        () => {


          document
            .querySelectorAll(
              ".type-btn"
            )
            .forEach(btn => {

              btn.classList.remove(
                "active"
              );

            });


          button.classList.add(
            "active"
          );


          currentType =
            button.dataset.type;


          generateNames();

        }
      );

    });


  // ==================================================
  // GENERATE BUTTON
  // ==================================================

  generateBtn.addEventListener(
    "click",
    generateNames
  );


  // ==================================================
  // ENTER
  // ==================================================

  countInput.addEventListener(
    "keydown",
    event => {


      if (
        event.key === "Enter"
      ) {

        generateNames();

      }

    }
  );


  // ==================================================
  // INITIAL
  // ==================================================

  generateNames();


</script>


</body>

</html>
