<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thai Name Generator - สร้างชื่อไทย ชื่ออังกฤษ และชื่อเล่น" />
    <meta name="theme-color" content="#2563eb" />
    <title>Thai Name Generator - สร้างชื่อไทย</title>
    
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --card: #eef6ff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --border: #dbeafe;
        --shadow: rgba(37, 99, 235, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      .header h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        margin: 0 0 12px;
        font-weight: 900;
        background: linear-gradient(135deg, var(--primary), #1e40af);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .header p {
        margin: 0;
        color: var(--muted);
        font-size: 1.1rem;
        font-weight: 500;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 12px 40px var(--shadow);
        padding: 32px;
        backdrop-filter: blur(10px);
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        display: block;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      select, button {
        padding: 12px 16px;
        font-size: 1rem;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-family: inherit;
        transition: all 0.2s ease;
      }

      select {
        background: white;
        color: var(--text);
        cursor: pointer;
      }

      select:hover {
        border-color: var(--primary);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
      }

      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      button {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-weight: 700;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-top: 32px;
      }

      .card {
        background: linear-gradient(135deg, var(--card), #f0f9ff);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        transition: all 0.3s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px var(--shadow);
        border-color: var(--primary);
      }

      .card h3 {
        margin: 0 0 12px;
        font-size: 0.85rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
      }

      .name {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        font-weight: 900;
        color: var(--primary);
        word-break: break-word;
        line-height: 1.2;
      }

      .note {
        margin-top: 32px;
        text-align: center;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .footer {
        margin-top: 40px;
        text-align: center;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 640px) {
        .container {
          padding: 32px 16px 60px;
        }

        .panel {
          padding: 24px;
          border-radius: 20px;
        }

        .controls {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .results {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .card {
          padding: 20px;
        }

        .header h1 {
          font-size: 2rem;
        }

        .name {
          font-size: 1.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Thai Name Generator</h1>
        <p>สร้างชื่อไทย ชื่ออังกฤษ และชื่อเล่น</p>
      </header>

      <main class="panel">
        <div class="controls">
          <div class="control-group">
            <label for="gender">เพศ</label>
            <select id="gender" aria-label="เลือกเพศ">
              <option value="male">ชาย</option>
              <option value="female">หญิง</option>
              <option value="unisex">ไม่ระบุ</option>
            </select>
          </div>

          <div class="control-group">
            <label for="style">สไตล์</label>
            <select id="style" aria-label="เลือกสไตล์ชื่อ">
              <option value="classic">คลาสสิก</option>
              <option value="modern">ทันสมัย</option>
              <option value="cute">น่ารัก</option>
              <option value="royal">หรูหรา</option>
            </select>
          </div>

          <div class="control-group">
            <label>&nbsp;</label>
            <button type="button" id="generateBtn" aria-label="สุ่มชื่อใหม่">
              🎲 สุ่มชื่อ
            </button>
          </div>
        </div>

        <div class="results">
          <article class="card">
            <h3>ชื่อไทย</h3>
            <p class="name" id="thaiName" lang="th">-</p>
          </article>

          <article class="card">
            <h3>ชื่ออังกฤษ</h3>
            <p class="name" id="englishName" lang="en">-</p>
          </article>

          <article class="card">
            <h3>ชื่อเล่น</h3>
            <p class="name" id="nickname" lang="th">-</p>
          </article>
        </div>

        <p class="note">✨ ดีไซน์สวยงาม คำนวณเร็ว ใช้งานง่าย</p>
      </main>

      <footer class="footer">
        <p>
          Made with ❤️ by <a href="https://github.com/Thivabc" target="_blank" rel="noopener noreferrer">Thivabc</a>
          | <a href="https://github.com/Thivabc/thai-name-generator" target="_blank" rel="noopener noreferrer">GitHub</a>
        </p>
      </footer>
    </div>

    <script type="module">
      import { thaiNames, englishNames, nicknames } from './data/names.js';

      /**
       * Get random item from array
       * @param {Array} list - Array to select from
       * @returns {*} Random item from the array
       */
      function getRandomItem(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      /**
       * Generate and display random names based on selected gender and style
       */
      function generateName() {
        const gender = document.getElementById('gender').value;
        const style = document.getElementById('style').value;

        try {
          const thaiList = thaiNames[gender][style];
          const englishList = englishNames[gender];
          const nicknameList = nicknames[gender];

          document.getElementById('thaiName').textContent = getRandomItem(thaiList);
          document.getElementById('englishName').textContent = getRandomItem(englishList);
          document.getElementById('nickname').textContent = getRandomItem(nicknameList);
        } catch (error) {
          console.error('Error generating name:', error);
          alert('เกิดข้อผิดพลาด โปรดลองอีกครั้ง');
        }
      }

      // Event listeners
      document.getElementById('generateBtn').addEventListener('click', generateName);

      // Generate initial names on page load
      document.addEventListener('DOMContentLoaded', generateName);

      // Allow keyboard shortcut (Enter or Space)
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Enter' || e.code === 'Space') {
          if (document.activeElement.tagName !== 'SELECT') {
            e.preventDefault();
            generateName();
          }
        }
      });
    </script>
  </body>
</html>
